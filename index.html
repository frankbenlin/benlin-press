<style>
  :root { --ink:#1a1a1a; --soft:#5f5f5f; --paper:#ffffff; --rule:#d0d0d0; color-scheme: light; }

  body { margin:0; background:var(--paper); color:var(--ink); font-family:Caladea, Cambria, Georgia, serif; line-height:1.5; }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 1.5rem; }
  h1 { font-size: 3rem; line-height:1; margin:0 0 .4rem; }
  .lede { font-style: italic; color: var(--soft); font-size:1.15rem; margin:0 0 2.5rem; }
  .fold { border-top:1px dashed var(--rule); margin: 2rem 0; }
  a { color: inherit; }
  ul { padding-left: 1.1rem; }
</style>
</head>
<body>
<main>

  <div class="fold"></div>
  <p><strong>Test files</strong></p>
  <ul>
    <li><a href="sample-zine.html">Sample zine (2 print pages)</a></li>
